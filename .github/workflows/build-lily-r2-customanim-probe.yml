name: Build Lily R2 CustomAnim Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-lily-r2-customanim-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build probe package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/LilyCombat_R2_CustomAnimProbe_v1"
          MOD="$ROOT/Mods/LilyCombat_R2_CustomAnimProbe"
          mkdir -p "$MOD/Scripts"
          : > "$MOD/enabled.txt"

          cat > "$MOD/Scripts/main.lua" <<'LUA'
          local TAG = "[LilyR2CustomAnim]"

          local candidates = {
              "N_Lily_Pompously",
              "N_Lily_Stand_Affirm",
              "N_Lily_idle5",
          }

          local candidate_index = 1
          local last_lily = nil
          local last_guid = nil
          local last_mode = "none"

          local function log(msg)
              print(string.format("%s %s\n", TAG, tostring(msg)))
          end

          local function valid(o)
              if o == nil then return false end
              local ok, result = pcall(function() return o:IsValid() end)
              return ok and result
          end

          local function get_player()
              local ok_req, UEHelpers = pcall(require, "UEHelpers")
              if ok_req and UEHelpers ~= nil then
                  local ok_pc, pc = pcall(function() return UEHelpers:GetPlayerController() end)
                  if ok_pc and valid(pc) then
                      local ok_pawn, pawn = pcall(function() return pc.Pawn end)
                      if ok_pawn and valid(pawn) then return pawn end
                  end
              end

              local eve = FindFirstOf("CH_P_EVE_01_Blueprint_C")
              if valid(eve) then return eve end
              return nil
          end

          local function actor_location(actor)
              if not valid(actor) then return nil end
              local ok, loc = pcall(function() return actor:K2_GetActorLocation() end)
              if ok then return loc end
              return nil
          end

          local function dist2_xy(a, b)
              if a == nil or b == nil then return math.huge end
              local dx = a.X - b.X
              local dy = a.Y - b.Y
              return dx * dx + dy * dy
          end

          local function select_lily()
              local all = FindAllOf("CH_NPC_01_Blueprint_C")
              if all == nil then
                  log("LILY_SCAN=NONE")
                  return nil
              end

              local player = get_player()
              local ploc = actor_location(player)
              local best = nil
              local best_d2 = math.huge
              local count = 0

              for _, obj in pairs(all) do
                  if valid(obj) then
                      count = count + 1
                      local loc = actor_location(obj)
                      local d2 = dist2_xy(loc, ploc)
                      if best == nil or d2 < best_d2 then
                          best = obj
                          best_d2 = d2
                      end
                  end
              end

              if not valid(best) then
                  log(string.format("LILY_SCAN=count=%d selected=NONE", count))
                  return nil
              end

              local ok_name, full_name = pcall(function() return best:GetFullName() end)
              log(string.format("LILY_SCAN=count=%d selected=%s distance_xy=%.2f",
                  count,
                  ok_name and tostring(full_name) or "<name-error>",
                  best_d2 < math.huge and math.sqrt(best_d2) or -1.0))

              last_lily = best
              return best
          end

          local function current_lily()
              if valid(last_lily) then return last_lily end
              return select_lily()
          end

          local function guid_text(g)
              if g == nil then return "nil" end
              local ok, s = pcall(function()
                  return string.format("%08X-%08X-%08X-%08X", g.A, g.B, g.C, g.D)
              end)
              if ok then return s end
              return tostring(g)
          end

          local function print_alpha(lily)
              if not valid(lily) then
                  log("ALPHA=NO_LILY")
                  return
              end

              local ok0, a0 = pcall(function() return lily:GetCurrentCustomAnimAlpha(0) end)
              local oka, aa = pcall(function() return lily:GetCurrentCustomAnimAddtiveAlpha() end)
              local okm, am = pcall(function() return lily:GetCurrentCustomAnimByMeshSlotAlpha(0) end)

              log(string.format(
                  "ALPHA custom0=%s additive=%s body_slot=%s mode=%s candidate=%s",
                  ok0 and tostring(a0) or "ERROR",
                  oka and tostring(aa) or "ERROR",
                  okm and tostring(am) or "ERROR",
                  last_mode,
                  candidates[candidate_index]
              ))
          end

          local function play_standard()
              local lily = current_lily()
              if not valid(lily) then
                  log("PLAY_STANDARD=NO_LILY")
                  return
              end

              local anim = candidates[candidate_index]
              local component_tag = FName("None")

              local ok, result = pcall(function()
                  return lily:ActorPlayCustomAnimName(
                      anim, component_tag,
                      0.0, -1.0, 1.0,
                      0.30, 0.30,
                      false, 100.0, false
                  )
              end)

              if ok then
                  last_guid = result
                  last_mode = "ActorPlayCustomAnimName"
                  log(string.format("PLAY_STANDARD=CALL_OK anim=%s guid=%s", anim, guid_text(result)))
                  print_alpha(lily)
              else
                  log(string.format("PLAY_STANDARD=CALL_ERROR anim=%s error=%s", anim, tostring(result)))
              end
          end

          local function play_body_slot()
              local lily = current_lily()
              if not valid(lily) then
                  log("PLAY_BODY_SLOT=NO_LILY")
                  return
              end

              local anim = candidates[candidate_index]
              local component_tag = FName("None")

              local ok, result = pcall(function()
                  return lily:ActorPlayCustomAnimNameMeshSlot(
                      0,
                      anim, component_tag,
                      0.0, -1.0, 1.0,
                      0.30, 0.30,
                      false, 100.0, false
                  )
              end)

              if ok then
                  last_guid = result
                  last_mode = "ActorPlayCustomAnimNameMeshSlot(Body)"
                  log(string.format("PLAY_BODY_SLOT=CALL_OK anim=%s guid=%s", anim, guid_text(result)))
                  print_alpha(lily)
              else
                  log(string.format("PLAY_BODY_SLOT=CALL_ERROR anim=%s error=%s", anim, tostring(result)))
              end
          end

          local function stop_last()
              local lily = current_lily()
              if not valid(lily) then
                  log("STOP=NO_LILY")
                  return
              end
              if last_guid == nil then
                  log("STOP=NO_GUID")
                  return
              end

              local ok, err = pcall(function()
                  lily:ActorStopCustomAnim(last_guid, FName("None"), 0.30)
              end)

              if ok then
                  log(string.format("STOP=CALL_OK guid=%s", guid_text(last_guid)))
              else
                  log(string.format("STOP=CALL_ERROR error=%s", tostring(err)))
              end
          end

          local function run_game_thread(fn)
              ExecuteInGameThread(function()
                  local ok, err = pcall(fn)
                  if not ok then log("GAME_THREAD_ERROR=" .. tostring(err)) end
              end)
          end

          RegisterKeyBind(Key.F5, {ModifierKey.CONTROL}, function()
              candidate_index = candidate_index + 1
              if candidate_index > #candidates then candidate_index = 1 end
              log("CANDIDATE=" .. candidates[candidate_index])
          end)

          RegisterKeyBind(Key.F6, {ModifierKey.CONTROL}, function()
              run_game_thread(play_standard)
          end)

          RegisterKeyBind(Key.F7, {ModifierKey.CONTROL}, function()
              run_game_thread(play_body_slot)
          end)

          RegisterKeyBind(Key.F8, {ModifierKey.CONTROL}, function()
              run_game_thread(function() print_alpha(current_lily()) end)
          end)

          RegisterKeyBind(Key.F9, {ModifierKey.CONTROL}, function()
              run_game_thread(stop_last)
          end)

          log("LOADED")
          log("CTRL+F5 candidate | CTRL+F6 standard | CTRL+F7 body-slot | CTRL+F8 alpha/status | CTRL+F9 stop")
          log("Default candidate=" .. candidates[candidate_index])
          LUA

          cat > "$ROOT/README.txt" <<'TXT'
          Lily Combat R2 — CustomAnim Probe v1

          Purpose
          -------
          Runtime-only probe for Lily custom animation. It does NOT replace or modify FIX10.

          Install
          -------
          Copy Mods/LilyCombat_R2_CustomAnimProbe into the existing UE4SS directory.
          Final path:
            Mods/LilyCombat_R2_CustomAnimProbe/Scripts/main.lua

          enabled.txt is included so no mods.txt edit is required.

          Controls
          --------
          Ctrl+F5  Cycle candidate
          Ctrl+F6  ActorPlayCustomAnimName
          Ctrl+F7  ActorPlayCustomAnimNameMeshSlot, ESBMesh_Body=0
          Ctrl+F8  Print custom/additive/body-slot alpha
          Ctrl+F9  Stop last GUID

          Candidates
          ----------
          N_Lily_Pompously
          N_Lily_Stand_Affirm
          N_Lily_idle5

          Call contract
          -------------
          Start=0.0 End=-1.0 Rate=1.0 BlendIn=0.30 BlendOut=0.30
          Loop=false Priority=100 ClearAllAnim=false ComponentTag=None

          PASS requires visible Lily animation plus custom/body alpha >0 while active,
          successful stop, and normal FIX10 follow afterwards. CALL_OK alone is not PASS.

          No hit/damage/combat logic is enabled.
          TXT

          (cd "$ROOT" && find . -type f ! -name MANIFEST_SHA256.txt -print0 | sort -z | xargs -0 sha256sum > MANIFEST_SHA256.txt)
          (cd "$ROOT" && zip -qr9 "$GITHUB_WORKSPACE/LilyCombat_R2_CustomAnimProbe_v1.zip" .)
          sha256sum "$GITHUB_WORKSPACE/LilyCombat_R2_CustomAnimProbe_v1.zip" | tee "$GITHUB_WORKSPACE/LilyCombat_R2_CustomAnimProbe_v1.sha256.txt"
          unzip -t "$GITHUB_WORKSPACE/LilyCombat_R2_CustomAnimProbe_v1.zip"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: LilyCombat_R2_CustomAnimProbe_v1
          path: |
            LilyCombat_R2_CustomAnimProbe_v1.zip
            LilyCombat_R2_CustomAnimProbe_v1.sha256.txt
          retention-days: 30
