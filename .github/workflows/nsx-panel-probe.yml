name: NS XPanel Version Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nsx-panel-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query panel update contract
        shell: bash
        run: |
          set -u
          mkdir -p report
          for path in '/version' '/update' '/latest'; do
            url="http://64.235.45.180:3090$path"
            echo "===== GET $url =====" | tee -a report/summary.txt
            curl -m 12 -sS -L -H 'Content-Type: application/json' -H 'Accept: application/json' -D - "$url" -o report/body.tmp | head -n 30 | tee -a report/summary.txt || true
            if [[ -s report/body.tmp ]]; then cat report/body.tmp | head -c 4096 | tee -a report/summary.txt; echo | tee -a report/summary.txt; fi
            echo "===== POST $url {} =====" | tee -a report/summary.txt
            curl -m 12 -sS -L -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{}' -D - "$url" -o report/body.tmp | head -n 30 | tee -a report/summary.txt || true
            if [[ -s report/body.tmp ]]; then cat report/body.tmp | head -c 4096 | tee -a report/summary.txt; echo | tee -a report/summary.txt; fi
          done

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nsx-panel-probe-json
          path: report/
          retention-days: 1
