name: CoreKeeper Burst Rizin Probe

on:
  push:
    paths:
      - '.github/workflows/corekeeper-burst-rizin.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch comparative Burst DLL only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dd" "$RUNNER_TEMP/ck"
          curl -fsSL 'https://github.com/SteamRE/DepotDownloader/releases/download/DepotDownloader_3.4.0/DepotDownloader-linux-x64.zip' -o "$RUNNER_TEMP/dd.zip"
          unzip -q "$RUNNER_TEMP/dd.zip" -d "$RUNNER_TEMP/dd"
          chmod +x "$RUNNER_TEMP/dd/DepotDownloader"
          printf '%s\n' 'CoreKeeperServer_Data/Plugins/x86_64/lib_burst_generated.dll' > "$RUNNER_TEMP/files.txt"
          "$RUNNER_TEMP/dd/DepotDownloader" -app 1963720 -depot 1963721 -manifest 1805980667806468302 -filelist "$RUNNER_TEMP/files.txt" -dir "$RUNNER_TEMP/ck"
          DLL="$RUNNER_TEMP/ck/CoreKeeperServer_Data/Plugins/x86_64/lib_burst_generated.dll"
          SIZE="$(stat -c '%s' "$DLL")"
          SHA="$(sha256sum "$DLL" | awk '{print $1}')"
          echo "COMPARATIVE_BURST_SIZE=$SIZE"
          echo "COMPARATIVE_BURST_SHA256=$SHA"
          echo 'TARGET_BURST_SIZE=70073856'
          echo 'TARGET_BURST_SHA256=66a36216861559558d513b476a73d99cb5b8bfd3cd422fffd082c6421a1c9c74'
          echo "SIZE_DELTA=$((SIZE-70073856))"
          echo "BURST_DLL=$DLL" >> "$GITHUB_ENV"

      - name: Download Rizin 0.9.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://github.com/rizinorg/rizin/releases/download/v0.9.1/rizin-v0.9.1-static-x86_64.tar.xz' -o "$RUNNER_TEMP/rizin.tar.xz"
          echo '9102249a9f0b6319c5334a2e5cf8d9cc3f2035e1d3def027c41f6a90f647e8cf  '"$RUNNER_TEMP/rizin.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rizin"
          tar -xJf "$RUNNER_TEMP/rizin.tar.xz" -C "$RUNNER_TEMP/rizin"
          RZ="$(find "$RUNNER_TEMP/rizin" -type f -name rizin -perm -111 -print -quit)"
          test -n "$RZ"
          echo "RIZIN_BIN=$RZ" >> "$GITHUB_ENV"
          "$RZ" -v

      - name: Rizin structure and exports
        shell: bash
        run: |
          set -euo pipefail
          echo '=== INFO ==='
          "$RIZIN_BIN" -q -c 'iI;q' "$BURST_DLL"
          echo '=== SECTIONS ==='
          "$RIZIN_BIN" -q -c 'iS;q' "$BURST_DLL" | sed -n '1,100p'
          echo '=== EXPORTS ==='
          "$RIZIN_BIN" -q -c 'iE;q' "$BURST_DLL" | tee "$RUNNER_TEMP/exports.txt" | sed -n '1,260p'
          echo '=== EXPORT COUNTS ==='
          echo "TOTAL_EXPORT_LINES=$(grep -c . "$RUNNER_TEMP/exports.txt" || true)"
          echo "INITIALIZER_LINES=$(grep -c 'burst.initialize' "$RUNNER_TEMP/exports.txt" || true)"
          echo "HASH_ONLY_LINES=$(grep -Ec '[[:space:]][0-9a-f]{32}[[:space:]]' "$RUNNER_TEMP/exports.txt" || true)"

      - name: Rizin render signature search
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ROUND HITS ==='
          "$RIZIN_BIN" -q -c 'e search.in=io.maps.x;/aa round;q' "$BURST_DLL" | tee "$RUNNER_TEMP/round.txt" | sed -n '1,180p'
          echo "ROUND_HIT_LINES=$(grep -c '0x' "$RUNNER_TEMP/round.txt" || true)"
          echo '=== FLOAT 16.0 HITS ==='
          "$RIZIN_BIN" -q -c '/x 00008041;q' "$BURST_DLL" | tee "$RUNNER_TEMP/f16.txt" | sed -n '1,100p'
          echo '=== FLOAT 0.0625 HITS ==='
          "$RIZIN_BIN" -q -c '/x 0000803d;q' "$BURST_DLL" | tee "$RUNNER_TEMP/f00625.txt" | sed -n '1,100p'
          grep -oE '0x[0-9a-fA-F]+' "$RUNNER_TEMP/round.txt" | awk '!seen[$0]++' | head -n 20 > "$RUNNER_TEMP/addrs.txt" || true
          : > "$RUNNER_TEMP/cmds.rz"
          while read -r a; do
            [ -n "$a" ] || continue
            printf 'echo === CANDIDATE %s ===\ns %s\npd -8\npd 30\n' "$a" "$a" >> "$RUNNER_TEMP/cmds.rz"
          done < "$RUNNER_TEMP/addrs.txt"
          echo '=== ROUND CONTEXTS ==='
          "$RIZIN_BIN" -q -i "$RUNNER_TEMP/cmds.rz" -c 'q' "$BURST_DLL" | sed -n '1,1300p'
