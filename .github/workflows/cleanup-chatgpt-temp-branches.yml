name: Cleanup ChatGPT temporary branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-chatgpt-temp-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for b in stellar-blade-analysis sb-analysis-tmp stellar-blade-analysis-mainprep _ignore DO-NOT-USE; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$b" || true
          done
