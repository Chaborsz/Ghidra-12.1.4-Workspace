name: Shirono Puppet Target Event Audit v0.12
on:
  push:
    branches: [analysis/shirono-multiclone]
    paths:
      - .github/workflows/shirono-v012-target-events.yml
  workflow_dispatch:
permissions: {contents: write}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Audit puppet original event commands and player-targeted side effects
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
          mkdir -p "$RUNNER_TEMP/shirono" audit-out/shirono-v012
          curl -fL --retry 4 'https://github.com/Chaborsz/Temporary/releases/download/ShironoYakata-DEMO/project_decrypted.7z' -o "$RUNNER_TEMP/d.7z"
          echo "4266d91cbf13a90b6ffc04b1e0465fd0cf918ba44aa20ab272fb6b6c12cda85b  $RUNNER_TEMP/d.7z" | sha256sum -c -
          7z x "$RUNNER_TEMP/d.7z" "-o$RUNNER_TEMP/shirono" -y >/dev/null
          python3 - "$RUNNER_TEMP/shirono/project_decrypted.json" audit-out/shirono-v012/puppet_events.json <<'PY'
          import json,sys,collections,hashlib
          j=json.load(open(sys.argv[1],encoding="utf-8-sig"))
          o=next(x for x in j["objectList"] if x["id"]==36)
          def sanitize(v):
            if isinstance(v,dict):return {k:sanitize(x) for k,x in v.items() if k not in ("javaScript","assignScript","memo")}
            if isinstance(v,list):return [sanitize(x) for x in v]
            return v
          rows=[]
          direct=[]
          counts=collections.Counter()
          for act in o["actionList"]:
            cmds=[]
            for c in act.get("objCommandList",[]):
              t=c.get("commandType")
              counts[t]+=1
              # Player direct: any command of types 1,3,4,8,9,31,32,40,57, etc that has target ID1
              refs=[]
              def walk(x,path=""):
                if isinstance(x,dict):
                  for k,v in x.items():
                    if k in ("objectId","targetObjectId","centerObjectId","variableObjectId","switchObjectId","objectType","variableId") and v==1:refs.append(path+"."+k)
                    if isinstance(v,(dict,list)):walk(v,path+"."+k)
                elif isinstance(x,list):
                  for i,z in enumerate(x):walk(z,path+f"[{i}]")
              walk(c)
              if refs:
                direct.append({"action":act["id"],"name":act.get("name"),"commandId":c.get("id"),"type":t,"refs":refs,"command":sanitize(c)})
              if act["id"] in (140,155,157,194) or refs and t in (1,3,4,8,9,31,32,40,57):
                cmds.append(sanitize(c))
            if cmds:
              rows.append({"actionId":act["id"],"actionName":act.get("name"),"commands":cmds})
          out={"enemyId":36,"playerTargetingCommands":direct,"targetActionDetails":rows,"types":counts}
          open(sys.argv[2],"w",encoding="utf-8").write(json.dumps(out,ensure_ascii=False,indent=2,default=dict))
          print("ACTION_COUNTS",len(rows),"PLAYER_REF_COMMANDS",len(direct))
          print("CMD_TYPE_COUNTS",str(counts))
          for x in direct:
            print("PLAYER_REF action",x["action"],"type",x["type"],"cmd",x["commandId"],"refs",x["refs"],"payload",str(x["command"])[:750])
          print("REPORT",sys.argv[2])
          PY
      - name: Commit audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit-out/shirono-v012/puppet_events.json
          if ! git diff --cached --quiet; then git commit -m "Audit puppet events referencing player ID1 in v0.12"; git push origin HEAD:analysis/shirono-multiclone; fi
