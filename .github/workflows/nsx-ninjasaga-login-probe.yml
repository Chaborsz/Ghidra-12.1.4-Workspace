name: NSX Ninja Saga Public Login Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nsx-ninjasaga-login-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect public endpoint structure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/147.0.0.0 Safari/537.36'
          curl -sS -L --compressed -A "$UA" -D report/home.headers -o report/home.html 'https://ninjasaga.cc/'
          python3 - <<'PY'
          from pathlib import Path
          import re
          raw=Path('report/home.html').read_text('utf-8',errors='replace')
          print('===== LOGIN FORM TAG =====')
          m=re.search(r'<form[^>]+id=["\']login-form["\'][^>]*>',raw,re.I)
          print(m.group(0) if m else 'NOT_FOUND')
          print('===== FETCH ENDPOINTS =====')
          seen=[]
          patterns=[
            r'fetch\s*\(\s*(["\'])(.*?)\1',
            r'url\s*:\s*(["\'])(.*?)\1',
            r'endpoint\s*[:=]\s*(["\'])(.*?)\1'
          ]
          for pat in patterns:
            for x in re.finditer(pat,raw,re.I|re.S):
              v=x.group(2)
              if v not in seen:
                seen.append(v); print(v)
          print('===== LOGIN STRING CONTEXTS =====')
          low=raw.lower()
          pos=0; n=0
          while n<40:
            p=low.find('/login',pos)
            if p<0: break
            a=max(0,p-500); b=min(len(raw),p+1200)
            print(re.sub(r'\s+',' ',raw[a:b]))
            print('---')
            pos=p+6; n+=1
          Path('report/endpoints.txt').write_text('\n'.join(seen)+'\n',encoding='utf-8')
          PY

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nsx-ninjasaga-public-login-probe
          path: report/
          retention-days: 2
