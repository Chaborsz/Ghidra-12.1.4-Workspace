name: NSX Ninja Saga Public Login Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nsx-ninjasaga-login-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect public application login route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/147.0.0.0 Safari/537.36'
          curl -sS -L --compressed -A "$UA" -o report/app.js 'https://ninjasaga.cc/assets/js/app.js'
          echo "APP_JS_BYTES=$(stat -c%s report/app.js)"
          python3 - <<'PY'
          from pathlib import Path
          import re
          js=Path('report/app.js').read_text('utf-8',errors='replace')
          print('===== LOGIN FORM REFERENCES =====')
          low=js.lower()
          for needle in ['login-form','/login','login','formdata','fetch(','xmlhttprequest','player_id','access_token','signature','hash_time']:
              pos=0; count=0
              while count<12:
                  p=low.find(needle.lower(),pos)
                  if p<0: break
                  a=max(0,p-1000); b=min(len(js),p+3000)
                  print(f'--- {needle} @ {p} ---')
                  print(re.sub(r'\s+',' ',js[a:b]).strip())
                  pos=p+len(needle); count+=1
          print('===== FETCH / ROUTE STRING LITERALS =====')
          seen=[]
          for m in re.finditer(r'(["\'])([^"\']{1,220})\1',js):
              v=m.group(2); lv=v.lower()
              if (v.startswith('/') or v.startswith('http') or 'login' in lv or 'auth' in lv) and v not in seen:
                  seen.append(v); print(v)
          Path('report/routes.txt').write_text('\n'.join(seen)+'\n',encoding='utf-8')
          PY

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nsx-ninjasaga-public-login-probe
          path: report/
          retention-days: 2
