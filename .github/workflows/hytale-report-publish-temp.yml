name: TEMP Publish Hytale RE Reports

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hytale-report-publish-temp.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download existing analysis artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/12142340951/zip > "$RUNNER_TEMP/hytale-reports.zip"
          unzip -q "$RUNNER_TEMP/hytale-reports.zip" -d "$RUNNER_TEMP/hytale-reports"
          find "$RUNNER_TEMP/hytale-reports" -maxdepth 2 -type f -printf '%P %s bytes\n'

      - name: Publish text reports temporarily
        shell: bash
        run: |
          set -euo pipefail
          OUT='analysis-output/hytale-partpreview'
          rm -rf "$OUT"
          mkdir -p "$OUT"
          for f in analysis-summary.md hashes.txt rizin-pe-info.txt rizin-target-strings.tsv rizin-targets.txt ghidra-targets.txt ghidra-headless.log; do
            src="$RUNNER_TEMP/hytale-reports/$f"
            if [ -f "$src" ]; then cp "$src" "$OUT/$f"; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT"
          git commit -m 'TEMP publish Hytale RE text reports'
          git push origin HEAD:main
